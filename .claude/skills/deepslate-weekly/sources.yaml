# DeepSlate Weekly — source registry
# Seed list for the weekly cyber-exposure newsletter collector.
# Edit freely: add/remove sources, tune weights, expand thought_leaders via a research pass.

meta:
  cadence: weekly
  lookback_days: 7          # only consider items published within this window
  target_story_count: 5
  timezone: Europe/London

# ---------------------------------------------------------------------------
# Editorial lens — what the newsletter is (and is not) about.
# The scorer uses these to rank; see SKILL.md for the full rubric.
# ---------------------------------------------------------------------------
lens:
  # Prioritise, in order:
  include:
    - major_incidents_with_loss_or_accumulation_angle   # breaches/outages where the story is the $ / systemic exposure
    - models_and_methodology_for_quantifying_cyber_risk  # frameworks, papers, tooling, catastrophe/accumulation modelling
  # Deliberately OUT of scope — down-rank hard or drop:
  exclude:
    - market_and_M&A_and_capital_moves     # rate changes, funding rounds, carrier launches, ILS capital raises
    - regulation_and_policy                # new rules, compliance deadlines, government mandates
    - vendor_marketing                     # thinly-veiled product pitches with no data or method
  keywords_boost:                          # presence nudges score up
    - accumulation
    - aggregation
    - systemic
    - catastrophe
    - loss estimate
    - insured loss
    - probable maximum loss
    - tail risk
    - correlated
    - single point of failure
    - quantification
    - actuarial
    - exceedance
    - scenario
  keywords_penalise:                       # presence nudges score down (market/reg noise)
    - funding round
    - rate increase
    - capital raise
    - appoints
    - hires
    - launches new
    - compliance deadline
    - fine

